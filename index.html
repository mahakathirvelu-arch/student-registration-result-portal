
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration & Result portal</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background:  white;
    }

    .main-card {
      max-width: 900px;
      margin: 50px auto;
      border: 2px solid #174ea6;
      border-radius: 20px;
    }

    h2 {
      color: #174ea6;
    }

    .result-box {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card main-card shadow p-4">
      <h2 class="text-center mb-4">
     Student Registration & Result portal
      </h2>

      <form id="studentForm">
        <h5 class="mb-3">Student Details</h5>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" id="name" class="form-control"
                   placeholder="Enter your name" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Register Number</label>
            <input type="text" id="regNo" class="form-control"
                   placeholder="Enter register number" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control"
                   placeholder="Enter email" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Course</label>
            <select id="course" class="form-select" required>
              <option value="">Select Course</option>
              <option value="CSE">Computer Science</option>
              <option value="AIML">AI & Machine Learning</option>
              <option value="ECE">Electronics</option>
              <option value="IT">Information Technology</option>
            </select>
          </div>
        </div>

        <hr>
        <h5 class="mb-3">Enter Subject Marks (out of 100)</h5>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Tamil</label>
            <input type="number" id="tamil" class="form-control"
                   min="0" max="100" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">English</label>
            <input type="number" id="english" class="form-control"
                   min="0" max="100" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Mathematics</label>
            <input type="number" id="maths" class="form-control"
                   min="0" max="100" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Computer Science</label>
            <input type="number" id="computer" class="form-control"
                   min="0" max="100" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Physics</label>
            <input type="number" id="physics" class="form-control"
                   min="0" max="100" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">
          Register & Calculate Result
        </button>
      </form>

     
      <div id="resultBox" class="result-box mt-4">
        <div class="alert alert-info">
          <h4 class="text-center">Student Result</h4>
          <p><strong>Name:</strong> <span id="showName"></span></p>
          <p><strong>Register No:</strong> <span id="showReg"></span></p>
          <p><strong>Course:</strong> <span id="showCourse"></span></p>
          <p><strong>Total Marks:</strong> <span id="showTotal"></span> / 500</p>
          <p><strong>Percentage:</strong> <span id="showPercentage"></span>%</p>
          <h5><strong>Status:</strong> <span id="showStatus"></span></h5>
        </div>
      </div>
    </div>

    <div class="card shadow p-4 mb-5">
      <h4 class="mb-3">Registered Students</h4>
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead class="table-primary">
            <tr>
              <th>Name</th>
              <th>Register No</th>
              <th>Course</th>
              <th>Total</th>
              <th>Percentage</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="studentTable">
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById("studentForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const regNo = document.getElementById("regNo").value.trim();
      const email = document.getElementById("email").value.trim();
      const course = document.getElementById("course").value;

    
      const marks = [
        Number(document.getElementById("tamil").value),
        Number(document.getElementById("english").value),
        Number(document.getElementById("maths").value),
        Number(document.getElementById("computer").value),
        Number(document.getElementById("physics").value)
      ];

      if (marks.some(mark => !Number.isFinite(mark) ||
          mark < 0 || mark > 100)) {
        alert("Enter marks between 0 and 100 for every subject.");
        return;
      }

      
      const total = marks.reduce((sum, mark) => sum + mark, 0);
      const percentage = total / 5;

      const passed = marks.every(mark => mark >= 35);
      const status = passed ? "PASS" : "FAIL";

     
      document.getElementById("showName").textContent = name;
      document.getElementById("showReg").textContent = regNo;
      document.getElementById("showCourse").textContent = course;
      document.getElementById("showTotal").textContent = total;
      document.getElementById("showPercentage").textContent =
        percentage.toFixed(2);
      
      const statusElement = document.getElementById("showStatus");
      statusElement.textContent = status;
      statusElement.className = passed ? "text-success" : "text-danger";

      document.getElementById("resultBox").style.display = "block";

      
      const row = document.createElement("tr");
      [name, regNo, course, total, percentage.toFixed(2) + "%", status]
        .forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });

      document.getElementById("studentTable").appendChild(row);

      
      form.reset();
    });
  </script>


</body>
</html>
